    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #2d3436;
            --text: #dfe6e9;
            --card-bg: #353b48;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 { font-size: 1.8rem; margin-bottom: 20px; }

        /* --- GRID LAYOUT --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns Layout */
            gap: 20px;
            width: 100%;
            max-width: 900px; /* Adjust based on your choice */
            margin: 0 auto;
        }

        /* Small Preview Card in Grid */
        .grid-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            border-color: var(--secondary);
        }

        .grid-card .thumb-cover {
            height: 120px;
            background: linear-gradient(135deg, #b2bec3, #636e72);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 10px;
        }

        .grid-card .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- POPUP OVERLAY --- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Scratch Container inside Popup */
        .popup-content {
            position: relative;
            background-color: transparent;
        }

        #scratch-container {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
            touch-action: none;
        }

        /* Close Cross Button */
        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #ff7675; }

        /* Inside Content Layer */
        .secret-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #333;
            z-index: 1;
        }

        .secret-content img {
            max-width: 80%;
            max-height: 70%;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .position-name {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary);
        }

        /* Canvas Layer */
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: crosshair;
        }

        /* Responsive Columns for Mobile Screens */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* Mobile par 2 columns ho jayenge taaki cards bohot chhote na dikhein */
                gap: 12px;
            }
        }
    </style>
</head>

        // Element References
        const cardsGrid = document.getElementById('cards-grid');
        const popupOverlay = document.getElementById('popup-overlay');
        const closePopupBtn = document.getElementById('close-popup');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const posImage = document.getElementById('position-image');
        const posLabel = document.getElementById('position-label');

        let isDrawing = false;
        let isRevealed = false;

        // --- GENRATE GRID CARDS ---
        function generateGrid() {
            cardsGrid.innerHTML = '';
            positionsDeck.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'grid-card';
                cardEl.innerHTML = `

                `;
                cardEl.onclick = () => openScratchPopup(index);
                cardsGrid.appendChild(cardEl);
            });

        // --- OPEN POPUP & INIT CANVAS ---
        function openScratchPopup(index) {
            activeIndex = index;
            isRevealed = false;
            
            const currentPos = positionsDeck[activeIndex];
            posImage.src = currentPos.image;
            posLabel.textContent = currentPos.name;

            // Reset canvas state
            canvas.style.transition = 'none';
            canvas.style.opacity = '1';
            canvas.style.zIndex = '2';

            // Canvas Fill
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#b2bec3'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texture Noise
            ctx.fillStyle = '#636e72';
            for(let i=0; i<500; i++){
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            }

            ctx.globalCompositeOperation = 'destination-out'; 

            // Show Popup
            popupOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop background scroll
        }

        // --- CLOSE POPUP ---
        function closeScratchPopup() {
            popupOverlay.classList.remove('active');
            document.body.style.overflow = ''; // Restore scroll
            activeIndex = null;
        }

        // --- SCRATCH LOGIC ---
        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing || isRevealed || activeIndex === null) return;
            e.preventDefault(); 

            const { x, y } = getTouchPos(e);
            ctx.lineWidth = SCRATCH_BRUSH_SIZE;
            ctx.lineCap = 'round';
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function startScratch(e) {
            if(activeIndex === null) return;
            isDrawing = true;
            ctx.beginPath();
            const { x, y } = getTouchPos(e);
            ctx.moveTo(x, y);
            scratch(e);
        }

        function stopScratch() {
            if(!isDrawing) return;
            isDrawing = false;
            checkRevealPercentage();
        }

        function checkRevealPercentage() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const percentage = (transparentPixels / (pixels.length / 4)) * 100;

            if (percentage > REVEAL_THRESHOLD) {
                isRevealed = true;
                canvas.style.transition = 'opacity 0.5s ease';
                canvas.style.opacity = '0';
                setTimeout(() => { canvas.style.zIndex = '-1'; }, 500);
            }
        }

        // --- EVENT LISTENERS ---
        closePopupBtn.onclick = closeScratchPopup;

        popupOverlay.onclick = (e) => {

        };

        // Mouse Events

        window.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', stopScratch);

        // Touch Events
        canvas.addEventListener('touchstart', startScratch);
        canvas.addEventListener('touchmove', scratch, { passive: false });
        canvas.addEventListener('touchend', stopScratch);
